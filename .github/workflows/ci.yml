# Nombre del workflow
name: CI Inventario API

# Eventos que ejecutan el workflow
on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    # Sistema operativo utilizado por el runner
    runs-on: ubuntu-latest

    # Variables utilizadas exclusivamente durante las pruebas del pipeline.
    # La contraseña es de una base PostgreSQL temporal creada por CI.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/inventario_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    # Base de datos temporal para ejecutar las pruebas.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: inventario_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

        # Comprueba que PostgreSQL esté listo antes de iniciar las pruebas.
        options: >-
          --health-cmd="pg_isready -U postgres -d inventario_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Descarga el código del repositorio.
      - name: Descargar código
        uses: actions/checkout@v4

      # Configura Java 21.
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Permite ejecutar Maven Wrapper en Linux.
      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      # Compila el proyecto y ejecuta las pruebas automáticas.
      - name: Compilar y ejecutar pruebas
        run: ./mvnw clean verify

      # La imagen Docker solamente se construye si las pruebas anteriores pasan.
      - name: Construir imagen Docker
        run: docker build -t inventario-api .