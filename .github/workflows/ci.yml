# Nombre del workflow
name: CI Inventario API

# Eventos que ejecutan el workflow
on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    # Sistema operativo utilizado por el runner
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # Configura Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Permite ejecutar Maven Wrapper en Linux
      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      # Compila el proyecto
      - name: Compilar proyecto
        run: ./mvnw clean package -DskipTests

      # Construye la imagen Docker
      - name: Construir imagen Docker
        run: docker build -t inventario-api .