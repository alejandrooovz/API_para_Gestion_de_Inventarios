# Nombre del workflow que aparecerá en GitHub Actions.
name: CI Inventario API

# Eventos que ejecutan el workflow.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]


jobs:
  # Job principal encargado de compilar y validar el proyecto.
  build:
    # Sistema operativo utilizado por el runner.
    runs-on: ubuntu-latest

    steps:
      - # Descarga el código del repositorio dentro del runner.
      - name: Descargar código
        uses: actions/checkout@v4


      # Configura Java 21 utilizando la distribución Temurin.
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Otorga permisos de ejecución al Maven Wrapper en Linux.
      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      # Compila el proyecto y genera el archivo JAR.
      # Actualmente se omiten las pruebas automáticas.
      - name: Compilar proyecto
        run: ./mvnw clean package -DskipTests

      # Construye la imagen Docker de la aplicación.
      - name: Construir imagen Docker
        run: docker build -t inventario-api .