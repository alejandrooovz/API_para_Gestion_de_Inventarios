apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-api
  labels:
    app: inventario-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventario-api
  template:
    metadata:
      labels:
        app: inventario-api
    spec:
      containers:
      - name: inventario-api
        image: inventario-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "k8s"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: inventario-config
              key: db_url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: inventario-config
              key: db_username
        - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
          valueFrom:
            configMapKeyRef:
              name: inventario-config
              key: db_driver
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventario-secret
              key: db_password
---
apiVersion: v1
kind: Service
metadata:
  name: inventario-service
spec:
  selector:
    app: inventario-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort