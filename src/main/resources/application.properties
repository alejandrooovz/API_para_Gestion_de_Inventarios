
# Nombre de la aplicación Spring Boot
spring.application.name=inventario-api

# Configuracion de PostgreSQL

# URL de conexión a PostgreSQL.
# Si no se define DB_URL, se utiliza la base de datos local por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}

# Usuario de PostgreSQL.
# Si no se define DB_USERNAME, se utiliza "postgres".
spring.datasource.username=${DB_USERNAME:postgres}

# Contraseña de PostgreSQL.
# Se recomienda definirla mediante la variable de entorno DB_PASSWORD
# y no almacenarla directamente en el repositorio.
spring.datasource.password=${DB_PASSWORD:TU_CONTRASENA_LOCAL}

# Configuracion de JPA / Hibernate

# Hibernate actualiza automáticamente la estructura de las tablas
# según las entidades del proyecto.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola las consultas SQL ejecutadas por Hibernate.
spring.jpa.show-sql=true

# Formatea las consultas SQL mostradas en consola para facilitar su lectura.
spring.jpa.properties.hibernate.format_sql=true